name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL website (buat mode URL)'
        required: false
        default: ''
      app_name:
        description: 'Nama aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package name (com.example.app)'
        required: true
        default: 'com.example.myapp'
      user_id:
        description: 'Telegram User ID'
        required: true
        default: ''
      zip_url:
        description: 'URL file ZIP project Flutter'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ═══════════════════════════════════════════════════
      # 1. CHECKOUT REPO
      # ═══════════════════════════════════════════════════
      - name: Checkout repository
        uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════
      # 2. NOTIF TELEGRAM — BUILD START
      # ═══════════════════════════════════════════════════
      - name: Notify Telegram (Start)
        if: ${{ github.event.inputs.user_id != '' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.user_id }}" \
            -d "text=🚀 Build dimulai untuk *${{ github.event.inputs.app_name }}*" \
            -d "parse_mode=Markdown"

      # ═══════════════════════════════════════════════════
      # 3. SETUP JAVA 17
      # ═══════════════════════════════════════════════════
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ═══════════════════════════════════════════════════
      # 4. SETUP FLUTTER
      # ═══════════════════════════════════════════════════
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ═══════════════════════════════════════════════════
      # 5. SETUP ANDROID SDK
      # ═══════════════════════════════════════════════════
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ═══════════════════════════════════════════════════
      # 6. BUILD DARI URL (WEBVIEW APP)
      # ═══════════════════════════════════════════════════
      - name: Build WebView App from URL
        if: ${{ github.event.inputs.url != '' && github.event.inputs.zip_url == '' }}
        run: |
          echo "🔨 Building WebView App from URL..."
          
          # Bikin project Flutter baru
          flutter create --org ${{ github.event.inputs.package_name }} --project-name web2apk_app temp_app
          cd temp_app
          
          # Install dependency webview_flutter
          flutter pub add webview_flutter
          flutter pub add permission_handler
          
          # Overwrite main.dart
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '${{ github.event.inputs.app_name }}',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primarySwatch: Colors.blue,
                  useMaterial3: true,
                ),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;
            bool isLoading = true;
            int progress = 0;

            @override
            void initState() {
              super.initState();
              _requestPermissions();
              
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int p) {
                      setState(() => progress = p);
                    },
                    onPageStarted: (String url) {
                      setState(() => isLoading = true);
                    },
                    onPageFinished: (String url) {
                      setState(() => isLoading = false);
                    },
                    onWebResourceError: (WebResourceError error) {
                      debugPrint('WebView error: ${error.description}');
                    },
                  ),
                )
                ..loadRequest(Uri.parse('${{ github.event.inputs.url }}'));
            }

            Future<void> _requestPermissions() async {
              await [
                Permission.camera,
                Permission.microphone,
                Permission.storage,
                Permission.location,
              ].request();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: controller),
                      if (isLoading)
                        LinearProgressIndicator(value: progress / 100),
                    ],
                  ),
                ),
              );
            }
          }
          EOF
          
          # Rename app
          sed -i "s/android:label=\".*\"/android:label=\"${{ github.event.inputs.app_name }}\"/" android/app/src/main/AndroidManifest.xml
          
          # Tambahin permission INTERNET
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # Build APK
          flutter build apk --release
          
          # Pindahin hasil
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-release.apk ../output/${{ github.event.inputs.app_name }}.apk

      # ═══════════════════════════════════════════════════
      # 7. BUILD DARI ZIP PROJECT FLUTTER
      # ═══════════════════════════════════════════════════
      - name: Build from ZIP Project
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          echo "🔨 Building from ZIP project..."
          
          # Download ZIP
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          
          # Extract
          mkdir -p project
          unzip -o project.zip -d project
          
          # Cari folder project (kadang nested)
          if [ -f "project/pubspec.yaml" ]; then
            cd project
          elif [ -d "project" ]; then
            cd $(find project -name "pubspec.yaml" -exec dirname {} \; | head -1)
          fi
          
          echo "📂 Working dir: $(pwd)"
          
          # Install dependency
          flutter pub get
          
          # Build APK
          flutter build apk --release
          
          # Pindahin hasil
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output/${{ github.event.inputs.app_name }}.apk"

      # ═══════════════════════════════════════════════════
      # 8. UPLOAD ARTIFACT
      # ═══════════════════════════════════════════════════
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-apk
          path: output/*.apk
          retention-days: 7

      # ═══════════════════════════════════════════════════
      # 9. UPLOAD APK KE TRANSFER.SH / CATBOX
      # ═══════════════════════════════════════════════════
      - name: Upload APK to Catbox
        id: upload
        run: |
          APK_FILE=$(ls output/*.apk | head -1)
          echo "📤 Uploading $APK_FILE to Catbox..."
          
          APK_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$APK_FILE" https://catbox.moe/user/api.php)
          
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "✅ Uploaded: $APK_URL"

      # ═══════════════════════════════════════════════════
      # 10. NOTIF TELEGRAM — BUILD SUCCESS
      # ═══════════════════════════════════════════════════
      - name: Notify Telegram (Success)
        if: ${{ github.event.inputs.user_id != '' && success() }}
        run: |
          APK_URL="${{ steps.upload.outputs.apk_url }}"
          APK_SIZE=$(du -h output/*.apk | head -1 | cut -f1)
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.user_id }}" \
            -d "text=✅ *Build Berhasil!*%0A%0A📱 App: ${{ github.event.inputs.app_name }}%0A📦 Size: $APK_SIZE%0A%0A📥 [Download APK]($APK_URL)" \
            -d "parse_mode=Markdown"

      # ═══════════════════════════════════════════════════
      # 11. NOTIF TELEGRAM — BUILD FAILED
      # ═══════════════════════════════════════════════════
      - name: Notify Telegram (Failed)
        if: ${{ github.event.inputs.user_id != '' && failure() }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.user_id }}" \
            -d "text=❌ *Build Gagal!*%0A%0A📱 App: ${{ github.event.inputs.app_name }}%0A%0ACek log di GitHub Actions." \
            -d "parse_mode=Markdown"
